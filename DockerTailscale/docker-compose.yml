services:
  tailscale:
    image: tailscale/tailscale:stable
    pull_policy: always
    hostname: docker-tailscale
    container_name: tailscale
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_SERVE_CONFIG=/var/lib/tailscale/serve-config.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./serve-config.json:/var/lib/tailscale/serve-config.json:ro
    cap_add:
      - net_admin
      - net_raw
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9002/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  seq:
    image: datalust/seq:latest
    pull_policy: always
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=${SEQ_ADMIN_PASSWORD}
    volumes:
      - seq-data:/data
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    network_mode: "service:tailscale"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5341/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  seq-data:
  tailscale-state:
